<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your sign-in link</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f5;font-family:Georgia,Times,'Times New Roman',serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:24px;padding:40px 36px;">
            <tr>
              <td>
                <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#171717;">
                  Couto Software House
                </p>
                <h1 style="margin:20px 0 0;font-size:28px;line-height:1.2;color:#171717;font-weight:600;">
                  Sign in to your account
                </h1>
                <p style="margin:20px 0 0;font-size:16px;line-height:1.6;color:#525252;">
                  Use the button below to sign in to
                  <a href="https://couto.software" style="color:#171717;font-weight:600;">couto.software</a>.
                </p>
                <p style="margin:32px 0 0;">
                  <a
                    href="{{ .ConfirmationURL }}"
                    style="display:inline-block;background:#171717;color:#ffffff;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;padding:12px 22px;border-radius:999px;"
                  >
                    Sign in
                  </a>
                </p>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#737373;">
                  If you did not request this link, you can ignore this email.
                </p>
                <p style="margin:32px 0 0;font-size:12px;line-height:1.6;color:#a3a3a3;">
                  Couto Software House · couto.software
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
